name: Build WachiTalk APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: keep signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: wachitalk-debug-keystore
      - run: npm install
      - run: npx cap add android
      - run: node scripts/patch-android.js
      - name: icon + splash
        continue-on-error: true
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#3d241b' --iconBackgroundColorDark '#3d241b' --splashBackgroundColor '#1a120c' --splashBackgroundColorDark '#1a120c'
      - run: npx cap sync android
      - name: build apk
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk WachiTalk-b${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: WachiTalk-b${{ github.run_number }}
          path: WachiTalk-b${{ github.run_number }}.apk
      - name: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: WachiTalk APK ${{ github.run_number }}
          files: WachiTalk-b${{ github.run_number }}.apk
